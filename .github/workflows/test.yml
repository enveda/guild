name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Build test image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --target test \
            -t guild-test \
            -f Dockerfile \
            .

      - name: Run tests
        run: docker run --rm guild-test python -m pytest -v tests/
