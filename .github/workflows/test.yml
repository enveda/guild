name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Build test image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --target test \
            -t guild-test \
            -f Dockerfile \
            .

      # `e2e` tests invoke real docking binaries and take minutes. gnina is only
      # copied into the final `docker` stage, so it is absent from `test` by
      # design -- run them locally against a full image instead.
      - name: Run tests
        run: docker run --rm guild-test python -m pytest -v -m "not e2e" tests/
