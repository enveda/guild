<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="white"/>

  <!-- Protein blob (left) -->
  <path d="M130,148 Q126,112 154,100 Q182,88 198,108 Q212,96 236,100 Q264,104 260,132 Q272,124 288,136 Q296,152 280,168 Q296,180 288,200 Q272,220 248,212 Q240,232 216,228 Q188,232 176,212 Q148,204 136,184 Q120,168 130,148 Z"
        fill="#BA7517" opacity="0.12" stroke="#BA7517" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Protein interior detail dots -->
  <circle cx="185" cy="145" r="6" fill="#BA7517" opacity="0.25"/>
  <circle cx="215" cy="130" r="5" fill="#BA7517" opacity="0.2"/>
  <circle cx="248" cy="148" r="5" fill="#BA7517" opacity="0.2"/>
  <circle cx="200" cy="175" r="7" fill="#BA7517" opacity="0.18"/>
  <circle cx="232" cy="180" r="5" fill="#BA7517" opacity="0.18"/>

  <!-- Binding arrow -->
  <defs>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#BA7517" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="298" y1="165" x2="336" y2="165" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- Ligand rectangle (right) -->
  <rect x="348" y="120" width="120" height="90" rx="16" fill="#EF9F27" opacity="0.15" stroke="#BA7517" stroke-width="2.5"/>
  <!-- Ligand inner hexagon motif -->
  <polygon points="408,142 424,151 424,169 408,178 392,169 392,151" fill="#BA7517" opacity="0.18" stroke="#BA7517" stroke-width="1.5"/>
  <circle cx="408" cy="160" r="10" fill="#BA7517" opacity="0.25"/>

  <!-- Bond site dots -->
  <circle cx="350" cy="142" r="4" fill="#BA7517" opacity="0.5"/>
  <circle cx="350" cy="178" r="4" fill="#BA7517" opacity="0.5"/>
  <circle cx="466" cy="142" r="4" fill="#BA7517" opacity="0.5"/>
  <circle cx="466" cy="178" r="4" fill="#BA7517" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="400" y="282" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-size="88" font-weight="900"
        fill="#633806" letter-spacing="6">Guild</text>

  <!-- Tagline -->
  <text x="400" y="322" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18" font-weight="400"
        fill="#BA7517" letter-spacing="7">END-TO-END PLBP FRAMEWORK</text>

  <!-- Subtle baseline rule -->
  <line x1="180" y1="336" x2="620" y2="336" stroke="#BA7517" stroke-width="0.8" opacity="0.4"/>
</svg>
