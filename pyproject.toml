[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guild"
version = "1.2.0"
description = "A unified framework for multi-method molecular docking and scoring"
license = "MIT"
authors = [
    { name = "António J Preto" },
    { name = "Yojana Gadiya" },
    { name = "Tyson Park" },
    { name = "Christoph Krettler" },
    { name = "Shweta Bhandare" },
    { name = "Keaton Noon" },
    { name = "Eric Fish" },
    { name = "António de La Vega de León" },
    { name = "Dani Domingo-Fernandéz" },
]

requires-python = ">=3.10,<3.11"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "mdanalysis>=2.7.0,<3",
    "prody>=2.4.1,<3",
    "pandas>=2.0.3,<3",
    "rmsd==1.6.5",
    "prefetch-generator==1.0.3",
    "seaborn>=0.13.2,<0.14",
    "chembl-webresource-client>=0.10.9,<0.11",
    "matplotlib-venn>=1.1.1,<2",

    "numpy>=1.23.0,<2",
    "chembl-downloader>=0.5.2,<0.6",
    "unipressed>=1.4.0,<2",
    "scikit-learn>=1.6.1,<2",
    "scipy>=1.13.1",
    "vina>=1.2.7",
    # 0.7 changed mk_prepare_receptor.py's CLI to -p <basename> plus one -f per
    # chain, which prepare_flex_receptor_pdbqt depends on.
    "meeko>=0.7.0",
    "boltz[cuda]>=1.0.0",
    "rdkit>=2022.9.5",
    "torch-geometric>=2.7.0",
    "torch>=2.9.0",
    "torch-cluster>=1.6.3",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "e3nn>=0.5.8",
    "fair-esm[esmfold]==2.0.0",
    "pyarrow>=22.0.0",
    "fastparquet>=2024.11.0",
    "plotly>=6.5.2",
    "nbformat>=5.10.4",
    "plip>=3.0.0",
    "prolif>=2.0.0,<3",
    "scikit-fingerprints>=1.18.0",
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "black>=26.3.1,<27",
    "ruff>=0.8.0,<1",
    "ipykernel>=6.29.5,<7",
    "pre-commit>=4.1.0,<5",
    "pytest>=9.0.3,<10",
]

[tool.uv]
default-groups = ["dev", ]

[[tool.uv.index]]
name = "prody-wheels"
url = "https://pypi.org/project/ProDy/#files"
explicit = true

[tool.uv.extra-build-dependencies]
torch-cluster = ["torch"]
torch-scatter = ["torch"]
torch-sparse = ["torch"]

[tool.hatchling]
packages = ["guild"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | DiffDock
  | KarmaDock
  | openbabel
  | pdbfixer
)
| # files
.*\.txt$
| .*\.yaml$
| .*\.yml$
| .*\.tsv$
| .*\.pdb$
| .*\.toml$
| .*\.md$
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "DiffDock",
    "KarmaDock",
    "openbabel",
    "pdbfixer",
    "docs",
    "notebooks",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
ignore = ["E501"]  # Line length handled by black

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ['e2e: marks tests as end-to-end (deselect with "-m "not e2e"")']
